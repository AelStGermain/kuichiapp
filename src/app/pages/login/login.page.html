<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Iniciar Sesión</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-input label="Email" label-placement="floating" type="email" [(ngModel)]="usuario.email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Password" label-placement="floating" type="password" [(ngModel)]="usuario.password"></ion-input>
      </ion-item>
      <ion-button expand="full" (click)="login()">Login</ion-button>
      <ion-button expand="full" color="secondary" (click)="quickLogin()">Quick Login (test)</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
