<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Kuichi 🐾</h1>
        <p>Tu compañero digital para el cuidado de mascotas</p>
      </div>

      <div class="login-form">
        <ion-item>
          <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="usuario.email"
            placeholder="ejemplo@correo.com">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="usuario.password"
            placeholder="••••••••">
          </ion-input>
        </ion-item>

        <ion-button expand="block" (click)="login()">
          <ion-icon name="log-in-outline" slot="start"></ion-icon>
          Iniciar Sesión
        </ion-button>
      </div>

      <div class="quick-login-section">
        <p>¿Solo quieres probar la app?</p>
        <ion-button expand="block" fill="outline" (click)="quickLogin()">
          <ion-icon name="flash-outline" slot="start"></ion-icon>
          Acceso Rápido (Demo)
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
