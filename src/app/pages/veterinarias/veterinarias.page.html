<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Veterinarias</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="veterinarias-content">
  <!-- Mapa Embebido de Santiago -->
  <div class="map-container">
    <h3>
      <ion-icon name="location-outline"></ion-icon>
      Veterinarias en Santiago
    </h3>
    <iframe width="100%" height="300" frameborder="0" style="border:0"
      [src]="'https://www.google.com/maps/embed/v1/search?key=AIzaSyBFw0Qbyq9zTFTd-tUY6dZWTgaQzuU17R8&q=veterinarias+santiago+chile&zoom=12&center=' + santiagoLat + ',' + santiagoLng | sanitize"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Lista de Veterinarias -->
  <div *ngIf="!veterinarias || veterinarias.length === 0" class="empty-state">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando veterinarias...</p>
  </div>

  <ion-list *ngIf="veterinarias && veterinarias.length > 0" class="card-list">
    <ion-card *ngFor="let vet of veterinarias" class="veterinaria-card">
      <ion-card-header>
        <ion-card-title>{{ vet.nombre }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="info-item">
          <ion-icon name="location-outline" slot="start" color="medium"></ion-icon>
          <ion-label>{{ vet.direccion }}</ion-label>
        </div>
        <div class="info-item">
          <ion-icon name="call" slot="start" color="medium"></ion-icon>
          <ion-label>{{ vet.telefono }}</ion-label>
        </div>
        <div class="info-item">
          <ion-icon name="time-outline" slot="start" color="medium"></ion-icon>
          <ion-label>{{ vet.horario }}</ion-label>
        </div>
        <div class="specialties">
          <ion-chip *ngFor="let especialidad of vet.especialidades" color="primary" outline="true">
            <ion-label>{{ especialidad }}</ion-label>
          </ion-chip>
        </div>

        <!-- Botones de acción -->
        <div class="action-buttons">
          <ion-button fill="outline" size="small" (click)="openInMaps(vet)">
            <ion-icon name="map" slot="start"></ion-icon>
            Ver en mapa
          </ion-button>
          <ion-button fill="outline" size="small" (click)="callVeterinaria(vet.telefono)">
            <ion-icon name="call" slot="start"></ion-icon>
            Llamar
          </ion-button>
          <ion-button *ngIf="isAdmin$ | async" fill="outline" size="small" color="warning" (click)="openEditModal(vet)">
            <ion-icon name="create" slot="icon-only"></ion-icon>
          </ion-button>
          <ion-button *ngIf="isAdmin$ | async" fill="outline" size="small" color="danger"
            (click)="deleteVeterinaria(vet)">
            <ion-icon name="trash" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <!-- Botón flotante para agregar (solo admin) -->
  <ion-fab *ngIf="isAdmin$ | async" vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="openAddModal()" color="primary">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>

<!-- Modal para agregar/editar (fuera del ion-content) -->
<ion-modal trigger="open-modal" (didDismiss)="closeModal()">
  <ng-template>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>{{ isEditing ? 'Editar' : 'Agregar' }} Veterinaria</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="closeModal()">
            <ion-icon name="close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-item>
        <ion-input label="Nombre *" labelPlacement="floating" [(ngModel)]="currentVeterinaria.nombre"
          placeholder="Ej: Clínica VetSalud">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Dirección *" labelPlacement="floating" [(ngModel)]="currentVeterinaria.direccion"
          placeholder="Ej: Av. Providencia 123, Santiago">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Teléfono" labelPlacement="floating" type="tel" [(ngModel)]="currentVeterinaria.telefono"
          placeholder="Ej: +56 2 1234 5678">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Horario" labelPlacement="floating" [(ngModel)]="currentVeterinaria.horario"
          placeholder="Ej: Lunes a Viernes 9:00 - 18:00">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-select label="Especialidades" labelPlacement="floating" multiple="true"
          [(ngModel)]="currentVeterinaria.especialidades">
          <ion-select-option value="perros">Perros</ion-select-option>
          <ion-select-option value="gatos">Gatos</ion-select-option>
          <ion-select-option value="exoticos">Exóticos</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-input label="Latitud" labelPlacement="floating" type="number" [(ngModel)]="currentVeterinaria.latitud"
          placeholder="-33.4489">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Longitud" labelPlacement="floating" type="number" [(ngModel)]="currentVeterinaria.longitud"
          placeholder="-70.6693">
        </ion-input>
      </ion-item>

      <ion-button expand="block" (click)="saveVeterinaria()" class="save-button" color="primary">
        <ion-icon name="checkmark" slot="start"></ion-icon>
        {{ isEditing ? 'Actualizar' : 'Guardar' }}
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
