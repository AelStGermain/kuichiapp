<ion-header>
  <ion-toolbar class="toolbar-primary">
    <ion-title>Kuichi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="home-content">
  <section class="hero app-hero-banner">
    <div class="hero-inner ion-padding">
      <ion-grid>
        <ion-row class="ion-align-items-center">
          <ion-col size="12" size-md="7">
            <div class="hero-text">
              <h1>Kuichi 🐾</h1>
              <p class="lead">Registra tus mascotas, revisa ofertas y gestiona todo desde tu cuenta.</p>
            </div>
          </ion-col>
          <ion-col size="12" size-md="5">
            <ion-card>
              <ion-card-header>
                <ion-card-title>🔐 Iniciar sesión</ion-card-title>
              </ion-card-header>
              <ion-card-content>
                <form (submit)="$event.preventDefault(); login();">
                  <ion-item>
                    <ion-label position="floating">Email</ion-label>
                    <ion-input [(ngModel)]="usuario.email" name="email" type="email"></ion-input>
                  </ion-item>
                  <ion-item>
                    <ion-label position="floating">Contraseña</ion-label>
                    <ion-input [(ngModel)]="usuario.password" name="password" type="password"></ion-input>
                  </ion-item>
                  <ion-button expand="block" color="primary" class="ion-margin-top" type="submit">Entrar</ion-button>
                </form>
              </ion-card-content>
            </ion-card>

            <ion-card>
              <ion-card-content>
                <p class="muted">¿Primera vez? Inicia sesión con cualquier correo y contraseña para probar (autenticación simulada).</p>
              </ion-card-content>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </section>
</ion-content>
